name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q math_bot.py emo_cla.py
      - name: Validate dependency imports
        run: python -c "import accelerate, datasets, discord, dotenv, flask, openpyxl, pandas, requests, sklearn, torch, transformers"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run repository hooks
        run: pre-commit run --all-files
